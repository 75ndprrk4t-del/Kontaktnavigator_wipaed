<!--
README / WARTUNGSHINWEIS
Stand: 13.10.2026

Hallo :D
Das ist der Kontaktnavigator der Wirtschaftspädagogik.

WIE DAS GANZE AUFGEBAUT IST
1. Oben im HTML stehen Gestaltung und Layout im <style>-Block.
2. Die sichtbaren Auswahlfelder stehen im Bereich mit der ID "topicGrid".
3. Die eigentlichen Kontaktdaten stehen weiter unten im JavaScript-Objekt "contacts".
4. Jeder Button hat ein data-topic. Dieser Wert muss exakt zu einem Eintrag im Objekt "contacts" passen.
5. Beim Klick wird der passende Kontakt eingeblendet. Mail, Telefon und Infoseite werden automatisch als Schaltflächen ergänzt.

EINBINDUNG IN TYPO3
Die veröffentlichte HTML-Seite wird in TYPO3 über ein iFrame eingebunden. Die konkrete iFrame-URL wird im TYPO3-Inhaltselement gepflegt und steht deshalb nicht in dieser Datei.

Wichtig in TYPO3:
- Beim iFrame die veröffentlichte URL dieser Seite eintragen.
- Bei "Automatic Size" die Option "iFrame Resizer" auswählen.
- Diese Einstellung ist wichtig, weil sich die Höhe des Navigators nach einem Klick verändert. Ohne automatische Größenanpassung kann Inhalt abgeschnitten werden oder es entstehen unschöne Scrollbalken im iFrame.
- Das dazu nötige Script ist hier im <head> eingebunden: iframeResizer.contentWindow.min.js. Bitte nicht entfernen, solange TYPO3 mit "iFrame Resizer" arbeitet.

SO WIRD AKTUALISIERT
1. Im Objekt "contacts" Namen, Funktionsmail, Telefon, Raum, Beschreibung und Link anpassen.
2. Falls ein neues Thema hinzukommt, zusätzlich oben im "topicGrid" einen Button mit passendem data-topic anlegen.
3. Datei speichern und im Repository aktualisieren.
4. Prüfen, ob die veröffentlichte URL weiterhin dieselbe ist. Nur wenn sich die URL geändert hat, muss auch das iFrame in TYPO3 angepasst werden.
5. Anschließend testen: Desktop, Smartphone, Tastaturbedienung, Mail-Schaltflächen, Telefon-Schaltflächen und alle weiterführenden Links.

Liebe Grüße
Stefan
-->

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontaktnavigator Wirtschaftspädagogik</title>
  <style>
    :root {
      --uni-blue: #235179;
      --uni-blue-hover: #3E85C6;
      --uni-blue-light: #eef5fa;
      --text: #222;
      --muted: #5d646b;
      --border: #d4dde5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }
    body { padding: 4px; }
    .navigator { width: 100%; max-width: 1050px; margin: 0 auto; }
    .intro { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }
    .topic-button {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--uni-blue);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .topic-button:hover { background: var(--uni-blue-light); }
    .topic-button:focus-visible,
    .action:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }
    .topic-title { font-weight: 700; line-height: 1.3; }
    .topic-arrow { color: var(--uni-blue); font-size: 1.55rem; font-weight: 700; }
    .result {
      display: none;
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--border);
      border-top: 6px solid var(--uni-blue);
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .result.is-visible { display: block; }
    .result-kicker {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .result h2 {
      margin: 0 0 10px;
      color: var(--uni-blue);
      font-size: 1.35rem;
    }
    .result-description { margin: 0 0 16px; line-height: 1.55; }
    .contact-details {
      margin: 0 0 18px;
      padding: 15px 16px;
      background: #f6f8fa;
      border-radius: 4px;
      line-height: 1.55;
    }
    .contact-details strong { display: block; margin-bottom: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .action, .back-button {
      min-height: 44px;
      padding: 10px 15px;
      border-radius: 4px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .action-primary {
      border: 1px solid var(--uni-blue);
      background: var(--uni-blue);
      color: white;
    }
    .action-primary:hover { background: var(--uni-blue-hover); }
    .action-secondary, .back-button {
      border: 1px solid var(--uni-blue);
      background: white;
      color: var(--uni-blue);
    }
    .action-secondary:hover, .back-button:hover { background: var(--uni-blue-light); }
    .back-button { margin-top: 16px; }
    @media (max-width: 700px) {
      .topic-grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .action { width: 100%; text-align: center; }
    }
  </style>
  <script src="https://www.uni-bamberg.de/_frontend/static/iframeResizer.contentWindow.min.js"></script>
</head>
<body>
<main class="navigator">
  <p class="intro">Wählen Sie Ihr Anliegen aus. Der Navigator zeigt Ihnen die passende Anlaufstelle und, soweit vorhanden, weiterführende Informationen.</p>

  <div class="topic-grid" id="topicGrid">
    <button class="topic-button" data-topic="thesis"><span class="topic-title">Abschlussarbeit</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="application"><span class="topic-title">Bewerbung Master WiPäd / Eignungsverfahren</span><span class="topic-arrow">›</span></button>

    <button class="topic-button" data-topic="hsg"><span class="topic-title">Hochschulgruppe / studentische Anliegen</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="accessibility"><span class="topic-title">Studium mit Beeinträchtigung / Nachteilsausgleich</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="orientation"><span class="topic-title">Studienzweifel / Orientierungshilfe</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="exams"><span class="topic-title">FlexNow / Prüfungs- oder Lehrveranstaltungsanmeldung</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="requests"><span class="topic-title">Vorkorrektur / Nachkorrektur / Anträge und Formulare</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="recognition"><span class="topic-title">Anerkennung / Learning Agreement / Auslandsstudium</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="office"><span class="topic-title">Sekretariat / organisatorische Frage</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="advising"><span class="topic-title">Studienberatung WiPäd / Zweitfächer / Umschreibung</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="advisingwi"><span class="topic-title">Studienberatung Master WiPäd/WI</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="schools"><span class="topic-title">Universitätsschulen / Praxisphase</span><span class="topic-arrow">›</span></button>
    <button class="topic-button" data-topic="unknown"><span class="topic-title">Ich bin nicht sicher, wer zuständig ist</span><span class="topic-arrow">›</span></button>
  </div>

  <section class="result" id="result" aria-live="polite" tabindex="-1">
    <p class="result-kicker">Ihre Anlaufstelle</p>
    <h2 id="resultTitle"></h2>
    <p class="result-description" id="resultDescription"></p>
    <div class="contact-details" id="contactDetails"></div>
    <div class="actions" id="actions"></div>
    <button class="back-button" id="backButton">Anderes Anliegen auswählen</button>
  </section>
</main>

const grid = document.getElementById("topicGrid");
const result = document.getElementById("result");
const title = document.getElementById("resultTitle");
const description = document.getElementById("resultDescription");
const details = document.getElementById("contactDetails");
const actions = document.getElementById("actions");

function showContact(key) {
  const c = contacts[key];
  if (!c) return;

  title.textContent = c.title;
  description.textContent = c.description;
  details.innerHTML = c.details;
  actions.innerHTML = "";

  if (c.email) {
    const a = document.createElement("a");
    a.className = "action action-primary";
    a.href = "mailto:" + c.email;
    a.textContent = "E-Mail schreiben";
    actions.appendChild(a);
  }

  if (c.phone) {
    const a = document.createElement("a");
    a.className = "action action-secondary";
    a.href = "tel:" + c.phone;
    a.textContent = "Anrufen";
    actions.appendChild(a);
  }

  if (c.info) {
    const a = document.createElement("a");
    a.className = c.email ? "action action-secondary" : "action action-primary";
    a.href = c.info;
    a.target = "_top";
    a.textContent = "Weitere Informationen";
    actions.appendChild(a);
  }

  result.classList.add("is-visible");
  result.focus({preventScroll:true});
  result.scrollIntoView({behavior:"smooth", block:"nearest"});
}

grid.addEventListener("click", function(e) {
  const button = e.target.closest("[data-topic]");
  if (button) showContact(button.dataset.topic);
});

document.getElementById("backButton").addEventListener("click", function() {
  result.classList.remove("is-visible");
  document.querySelector(".topic-button").focus();
});
</script>
</body>
